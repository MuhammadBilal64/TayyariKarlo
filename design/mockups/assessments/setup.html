<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TayyariKarlo — Start assessment (mockup)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Sora:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../auth/tokens.css" />
    <style>
      .shell {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        border-bottom: 1px solid var(--line);
        background: color-mix(in srgb, var(--paper-lift) 80%, transparent);
        padding: 1rem 1.25rem;
        backdrop-filter: blur(6px);
      }

      @media (min-width: 640px) {
        .topbar {
          padding-inline: 2rem;
        }
      }

      .topbar .user {
        display: none;
        margin: 0;
        font-size: 0.9rem;
        color: var(--ink-soft);
      }

      @media (min-width: 640px) {
        .topbar .user {
          display: block;
        }
      }

      .top-actions {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .btn-sm {
        width: auto;
        margin: 0;
        padding: 0.5rem 0.85rem;
        font-size: 0.85rem;
      }

      main {
        width: 100%;
        max-width: 42rem;
        margin: 0 auto;
        flex: 1;
        padding: 2.5rem 1.25rem 3.5rem;
      }

      @media (min-width: 640px) {
        main {
          padding-inline: 2rem;
        }
      }

      .section-label {
        margin: 1.75rem 0 0.65rem;
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--ink-soft);
      }

      .topic-list {
        display: grid;
        gap: 0.45rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .topic-list label {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin: 0;
        padding: 0.85rem 1rem;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--paper-lift);
        cursor: pointer;
        transition:
          border-color 0.15s ease,
          background 0.15s ease;
      }

      .topic-list label:hover {
        border-color: color-mix(in srgb, var(--signal) 45%, var(--line));
      }

      .topic-list input {
        width: auto;
        margin: 0;
        accent-color: var(--signal);
      }

      .topic-list input:checked + span {
        color: var(--ink);
        font-weight: 600;
      }

      .topic-list label:has(input:checked) {
        border-color: var(--signal);
        background: var(--signal-soft);
      }

      .diff-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.5rem;
      }

      .diff-row label {
        margin: 0;
        text-align: center;
        padding: 0.75rem 0.5rem;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: #fff;
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: 500;
      }

      .diff-row input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }

      .diff-row label:has(input:checked) {
        border-color: var(--signal);
        background: var(--signal-soft);
        color: var(--signal-hover);
        font-weight: 600;
      }

      .count-row {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .count-row input {
        width: 5.5rem;
      }

      .count-hint {
        margin: 0;
        font-size: 0.85rem;
        color: var(--mute);
      }

      .start-wrap {
        margin-top: 2rem;
        padding-top: 1.5rem;
        border-top: 1px solid var(--line);
      }

      .start-wrap .btn {
        max-width: 16rem;
      }
    </style>
  </head>
  <body class="graph-bg">
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="#">TayyariKarlo</a>
        <div class="top-actions">
          <p class="user">Alex Chen</p>
          <button type="button" class="btn btn-ghost btn-sm">Sign out</button>
        </div>
      </header>

      <main>
        <p class="eyebrow">Assessment</p>
        <h1>Choose your set</h1>
        <p class="lede">
          Pick a topic and difficulty. We’ll pull a fresh mix of MCQs — no
          answer key until you submit.
        </p>

        <p class="section-label">Topic</p>
        <ul class="topic-list">
          <li>
            <label>
              <input type="radio" name="topic" checked />
              <span>System design</span>
            </label>
          </li>
          <li>
            <label>
              <input type="radio" name="topic" />
              <span>Data structures &amp; algorithms</span>
            </label>
          </li>
          <li>
            <label>
              <input type="radio" name="topic" />
              <span>Database systems</span>
            </label>
          </li>
          <li>
            <label>
              <input type="radio" name="topic" />
              <span>Operating systems</span>
            </label>
          </li>
          <li>
            <label>
              <input type="radio" name="topic" />
              <span>Computer networks</span>
            </label>
          </li>
        </ul>

        <p class="section-label">Difficulty</p>
        <div class="diff-row">
          <label>
            <input type="radio" name="diff" checked />
            Easy
          </label>
          <label>
            <input type="radio" name="diff" />
            Medium
          </label>
          <label>
            <input type="radio" name="diff" />
            Hard
          </label>
        </div>

        <p class="section-label">Questions</p>
        <div class="count-row">
          <input type="number" value="10" min="1" max="50" aria-label="Count" />
          <p class="count-hint">Between 1 and 50</p>
        </div>

        <div class="start-wrap">
          <button type="button" class="btn">Start assessment</button>
        </div>
      </main>
    </div>
  </body>
</html>
