<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TayyariKarlo — Take assessment (mockup)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Sora:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../auth/tokens.css" />
    <style>
      .shell {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        border-bottom: 1px solid var(--line);
        background: color-mix(in srgb, var(--paper-lift) 80%, transparent);
        padding: 1rem 1.25rem;
        backdrop-filter: blur(6px);
      }

      @media (min-width: 640px) {
        .topbar {
          padding-inline: 2rem;
        }
      }

      .btn-sm {
        width: auto;
        margin: 0;
        padding: 0.5rem 0.85rem;
        font-size: 0.85rem;
      }

      main {
        width: 100%;
        max-width: 42rem;
        margin: 0 auto;
        flex: 1;
        padding: 2rem 1.25rem 3.5rem;
      }

      @media (min-width: 640px) {
        main {
          padding-inline: 2rem;
        }
      }

      .progress-meta {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 1rem;
        margin-bottom: 0.55rem;
      }

      .progress-meta p {
        margin: 0;
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--mute);
      }

      .progress-meta span {
        font-size: 0.85rem;
        color: var(--ink-soft);
        text-transform: none;
        letter-spacing: 0;
        font-weight: 500;
      }

      .track {
        height: 3px;
        border-radius: 999px;
        background: var(--line);
        overflow: hidden;
      }

      .track > i {
        display: block;
        width: 40%;
        height: 100%;
        background: var(--signal);
      }

      .stem {
        margin: 1.75rem 0 0;
        font-family: var(--font-display);
        font-size: clamp(1.55rem, 3.2vw, 2.05rem);
        font-weight: 400;
        letter-spacing: -0.02em;
        line-height: 1.25;
      }

      .options {
        display: grid;
        gap: 0.5rem;
        margin: 1.5rem 0 0;
        padding: 0;
        list-style: none;
      }

      .options label {
        display: grid;
        grid-template-columns: 1.75rem 1fr;
        gap: 0.85rem;
        align-items: start;
        margin: 0;
        padding: 1rem 1.05rem;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: #fff;
        cursor: pointer;
        transition:
          border-color 0.15s ease,
          background 0.15s ease,
          transform 0.12s ease;
      }

      .options label:hover {
        border-color: color-mix(in srgb, var(--signal) 40%, var(--line));
      }

      .options label:active {
        transform: translateY(1px);
      }

      .options input {
        margin-top: 0.2rem;
        width: auto;
        accent-color: var(--signal);
      }

      .options label:has(input:checked) {
        border-color: var(--signal);
        background: var(--signal-soft);
      }

      .letter {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 1.75rem;
        height: 1.75rem;
        border-radius: 999px;
        border: 1px solid var(--line);
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--ink-soft);
        background: var(--paper-lift);
      }

      .options label:has(input:checked) .letter {
        border-color: var(--signal);
        background: var(--signal);
        color: #fff;
      }

      .opt-text {
        margin: 0.15rem 0 0;
        font-size: 0.98rem;
        line-height: 1.45;
        color: var(--ink);
      }

      .nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.65rem;
        margin-top: 2rem;
        padding-top: 1.35rem;
        border-top: 1px solid var(--line);
      }

      .nav .btn {
        width: auto;
        min-width: 8.5rem;
        margin: 0;
      }
    </style>
  </head>
  <body class="graph-bg">
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="#">TayyariKarlo</a>
        <button type="button" class="btn btn-ghost btn-sm">Exit</button>
      </header>

      <main>
        <div class="progress-meta">
          <p>Question <span>4 of 10</span></p>
          <p><span>System design · Easy</span></p>
        </div>
        <div class="track" aria-hidden="true"><i></i></div>

        <h1 class="stem">
          Which pattern best isolates a write-heavy service from spike traffic
          without dropping accepted work?
        </h1>

        <ul class="options">
          <li>
            <label>
              <input type="radio" name="q" />
              <span class="letter">A</span>
              <p class="opt-text">Sync fan-out to every downstream consumer</p>
            </label>
          </li>
          <li>
            <label>
              <input type="radio" name="q" checked />
              <span class="letter">B</span>
              <p class="opt-text">
                Durable queue with consumers pulling at their own rate
              </p>
            </label>
          </li>
          <li>
            <label>
              <input type="radio" name="q" />
              <span class="letter">C</span>
              <p class="opt-text">
                Shared mutable cache with no eviction policy
              </p>
            </label>
          </li>
          <li>
            <label>
              <input type="radio" name="q" />
              <span class="letter">D</span>
              <p class="opt-text">
                Hard timeout with silent discard on overload
              </p>
            </label>
          </li>
        </ul>

        <div class="nav">
          <button type="button" class="btn btn-ghost">Back</button>
          <button type="button" class="btn">Next</button>
        </div>
      </main>
    </div>
  </body>
</html>
