services:
  postgres:
    image: postgres:16-alpine
    container_name: tayyari-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: tayyari
      POSTGRES_PASSWORD: tayyari
      POSTGRES_DB: tayyari
    volumes:
      - tayyari_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tayyari -d tayyari']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tayyari_pg_data:
